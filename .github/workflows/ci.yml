name: SmartHire CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
     
      - name: Checkout code
        uses: actions/checkout@v4

 
      - name: Create Laravel .env file
        run: |
          cat <<EOF > laravel/.env
          APP_NAME=SmartHire
          APP_ENV=testing
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_API_URL=${{ secrets.GROQ_API_URL }}
          GROQ_MODEL=${{ secrets.GROQ_MODEL }}
          FRONTEND_URL=http://172.17.0.1:5174
          SESSION_DRIVER=file
          CACHE_STORE=file
          EOF


      - name: Create Vue .env file
        run: |
          cat <<EOF > vue/.env
          VITE_API_URL=http://172.17.0.1:8000
          FRONTEND_URL=http://172.17.0.1:5174
          EOF

  
      - name: Install Vue node_modules for CI
        run: |
          cd vue
          npm install --include=dev
          npm install vite@latest --save-dev
          ls node_modules/.bin/vite


      - name: Build and run Docker containers
        run: docker compose up -d --build


      - name: Wait for Selenium to be ready
        run: |
          timeout 120s bash -c 'until curl -sf http://localhost:4444/wd/hub/status | grep -q "ready.*true"; do echo "waiting for selenium..."; sleep 3; done'


      - name: Wait for Laravel to be ready
        run: |
          timeout 120s bash -c 'until curl -sf http://localhost:8000; do echo "waiting for laravel..."; sleep 3; done'


      - name: Wait for Vue to be ready
        run: |
          timeout 120s bash -c 'until curl -sf http://localhost:5174; do echo "waiting for vue..."; sleep 3; done'

      - name: Test Aiven MySQL connection
        run: |
          echo "Testing Aiven DB connection..."
          # expand secrets in shell first
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          docker exec smarthire_laravel bash -c "
            php -r '
              try {
                \$pdo = new PDO(
                  \"mysql:host=${DB_HOST};port=${DB_PORT};dbname=${DB_DATABASE};charset=utf8\",
                  \"${DB_USERNAME}\",
                  \"${DB_PASSWORD}\",
                  [
                    PDO::MYSQL_ATTR_SSL_CA => \"/var/www/html/certs/ca.pem\",
                    PDO::MYSQL_ATTR_SSL_VERIFY_SERVER_CERT => false
                  ]
                );
                echo \"DB connection successful!\\n\";
              } catch (PDOException \$e) {
                echo \"DB connection failed: \" . \$e->getMessage() . \"\\n\";
                exit(1);
              }
            ';
          "


      - name: Show container status
        run: |
          docker compose ps
          docker logs smarthire_laravel
          docker logs smarthire_selenium

      - name: Fix Laravel composer autoload
        run: |
          docker exec smarthire_laravel composer install --no-interaction --prefer-dist
          docker exec smarthire_laravel composer require --dev laravel/dusk --no-interaction
          docker exec smarthire_laravel php artisan dusk:install --no-interaction
          docker exec smarthire_laravel php artisan storage:link --force
          docker exec smarthire_laravel composer dump-autoload --optimize
          docker exec smarthire_laravel php artisan config:clear
          docker exec smarthire_laravel chmod -R 777 /var/www/html/storage
          docker exec smarthire_laravel chmod -R 777 /var/www/html/bootstrap/cache

      - name: Debug env and API
        run: |
          echo "=== Vue .env ==="
          docker exec smarthire_vue cat /app/.env
          echo "=== Laravel FRONTEND_URL ==="
          docker exec smarthire_laravel grep FRONTEND_URL /var/www/html/.env
          echo "=== Test API ==="
          curl -s -X POST http://localhost:8000/worker/login \
            -H "Content-Type: application/json" \
            -d '{"email":"dd@dd.dd","password":"123456"}'

      - name: Test API login
        run: |
          curl -v -X POST http://localhost:8000/worker/login \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"email":"dd@dd.dd","password":"123456"}'

      - name: Get Laravel error log
        if: always()
        run: |
          docker exec smarthire_laravel cat /var/www/html/storage/logs/laravel.log | tail -50

      - name: Run Behat Selenium Tests
        run: docker exec smarthire_laravel vendor/bin/behat --format=pretty --no-interaction

 
      - name: Docker Compose Logs on Failure
        if: failure()
        run: docker compose logs