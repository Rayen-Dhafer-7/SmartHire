name: SmartHire CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  behat-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services with Docker Compose
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Selenium and Laravel to be ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:4444/wd/hub/status > /dev/null && curl -sf http://localhost:8000 > /dev/null; then
              echo "Services are ready."
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Run Behat tests
        run: docker exec smarthire_laravel vendor/bin/behat --format=pretty
