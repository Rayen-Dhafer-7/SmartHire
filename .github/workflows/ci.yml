name: SmartHire CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create certificate file
        run: |
          mkdir -p certs
          echo "${{ secrets.DB_SSL_CA }}" > certs/ca.pem
          chmod 644 certs/ca.pem
          echo "Certificate created at certs/ca.pem"
          ls -la certs/

      - name: Prepare env files for CI
        run: |
          cp laravel/.env.example laravel/.env
          APP_KEY="base64:$(openssl rand -base64 32)"
          sed -i "s|APP_KEY=|APP_KEY=${APP_KEY}|" laravel/.env
          sed -i "s|DB_CONNECTION=.*|DB_CONNECTION=mysql|" laravel/.env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> laravel/.env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> laravel/.env
          echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> laravel/.env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> laravel/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> laravel/.env
          echo "MYSQL_ATTR_SSL_CA=certs/ca.pem" >> laravel/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> laravel/.env
          echo "VITE_API_URL=http://placeholder:8000" > vue/.env
          echo "FRONTEND_URL=http://placeholder:5174" >> vue/.env

      - name: Install Vue node_modules for CI
        run: |
          cd vue
          npm install --include=dev
          npm install vite@latest --save-dev

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build --wait
          sleep 10

      - name: Show container status
        run: docker compose ps -a

      - name: Verify certificate in container
        run: |
          echo "Checking certificate in container:"
          docker exec smarthire_laravel ls -la /var/www/html/certs/ || true
          docker exec --user root smarthire_laravel chmod -R 777 storage bootstrap/cache

      - name: Set Vue .env and Behat base_url to host IP
        run: |
          HOST_IP=$(docker exec smarthire_selenium ip route show default 2>/dev/null | awk '/default/ {print $3}' | tr -d '[:space:]' || echo "172.17.0.1")
          if [ -z "$HOST_IP" ]; then
            HOST_IP="172.17.0.1"
            echo "Using fallback host IP: $HOST_IP"
          else
            echo "Detected host gateway IP: $HOST_IP"
          fi
          echo "VITE_API_URL=http://${HOST_IP}:8000" > vue/.env
          echo "FRONTEND_URL=http://${HOST_IP}:5174" >> vue/.env
          if [ -f laravel/behat.yml ]; then
            sed -i "s|base_url:.*|base_url: http://${HOST_IP}:5174|" laravel/behat.yml
          fi

      - name: Restart Vue to pick up .env
        run: docker compose restart vue

      - name: Prepare Laravel (No migrations)
        run: |
          docker exec smarthire_laravel php artisan config:clear
          docker exec smarthire_laravel php artisan config:cache

      - name: Wait for Laravel to respond
        run: |
          echo "Waiting for Laravel..."
          code="000"
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || true)
            if [ "$code" != "000" ]; then
              echo "Laravel responded HTTP $code"
              break
            fi
            sleep 5
          done
          if [ "$code" = "000" ]; then
            echo "Laravel logs:"
            docker compose logs laravel --tail=80
            exit 1
          fi

      - name: Wait for Vue dev server
        run: |
          echo "Polling Vue..."
          code="000"
          for i in $(seq 1 72); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5174/ || true)
            if [ "$code" != "000" ]; then
              echo "Vue responded HTTP $code"
              break
            fi
            sleep 5
          done
          if [ "$code" = "000" ]; then
            echo "Vue logs:"
            docker compose logs vue --tail=200
            exit 1
          fi

      - name: Test updated debug-speed endpoint
        run: |
          echo "========================================="
          echo "Testing debug-speed endpoint"
          echo "========================================="
          docker exec smarthire_laravel php artisan config:show database.connections.mysql.host
          docker exec smarthire_laravel php artisan config:show database.default
          docker exec smarthire_laravel grep -E "DB_CONNECTION|DB_HOST" /var/www/html/.env
          docker exec smarthire_laravel php -r "
            \$host = getenv('DB_HOST');
            \$port = getenv('DB_PORT');
            echo 'HOST: [' . \$host . ']' . PHP_EOL;
            echo 'PORT: [' . \$port . ']' . PHP_EOL;
            echo 'LENGTH: ' . strlen(\$host) . PHP_EOL;
            \$sock = @fsockopen(\$host, (int)\$port, \$errno, \$errstr, 5);
            echo \$sock ? 'TCP: OK' : 'TCP FAILED: ' . \$errstr;
          "
          curl -s http://localhost:8000/debug-speed | jq . || curl -v http://localhost:8000/debug-speed

      - name: Test worker login endpoint
        run: |
          echo "========================================="
          echo "Testing worker login endpoint"
          echo "========================================="
          curl -s -X POST http://localhost:8000/worker/login \
            -H "Content-Type: application/json" \
            -d '{"email":"dd@dd.dd","password":"123456"}' | jq . || \
          curl -v -X POST http://localhost:8000/worker/login \
            -H "Content-Type: application/json" \
            -d '{"email":"dd@dd.dd","password":"123456"}'

      - name: Warm Vue app
        run: |
          curl -s -o /dev/null http://localhost:5174/
          curl -s -o /dev/null http://localhost:5174/login
          sleep 15

      - name: Run Behat tests
        run: docker exec smarthire_laravel vendor/bin/behat --format=pretty || true

  # ============================================
  # CD — only runs on push to main after CI pass
  # ============================================
  deploy-to-aws:
    runs-on: ubuntu-latest
    needs: laravel-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Laravel image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/smarthire-laravel:$IMAGE_TAG \
            -t $ECR_REGISTRY/smarthire-laravel:latest \
            ./laravel
          docker push $ECR_REGISTRY/smarthire-laravel:$IMAGE_TAG
          docker push $ECR_REGISTRY/smarthire-laravel:latest

      - name: Build and push Vue image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t $ECR_REGISTRY/smarthire-vue:$IMAGE_TAG \
            -t $ECR_REGISTRY/smarthire-vue:latest \
            ./vue
          docker push $ECR_REGISTRY/smarthire-vue:$IMAGE_TAG
          docker push $ECR_REGISTRY/smarthire-vue:latest

      # Uncomment these after images are confirmed in ECR
      # - name: Deploy Laravel to App Runner
      #   run: |
      #     aws apprunner start-deployment \
      #       --service-arn ${{ secrets.APP_RUNNER_ARN_LARAVEL }}

      # - name: Deploy Vue to App Runner
      #   run: |
      #     aws apprunner start-deployment \
      #       --service-arn ${{ secrets.APP_RUNNER_ARN_VUE }}