name: SmartHire CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Laravel .env file
        run: |
          cat <<EOF > laravel/.env
          APP_NAME=SmartHire
          APP_ENV=testing
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_API_URL=${{ secrets.GROQ_API_URL }}
          GROQ_MODEL=${{ secrets.GROQ_MODEL }}
          DUSK_DRIVER_URL=http://selenium:4444/wd/hub
          EOF

      - name: Build and run Docker containers
        run: docker compose up -d --build

      - name: Show all container logs
        run: docker compose logs
        
      - name: Wait for Laravel to be ready
        run: |
          timeout 120s bash -c 'until curl -sf http://localhost:8000; do echo "waiting..."; sleep 3; done'
          docker compose ps

      - name: Run Migrations
        run: docker exec smarthire_laravel php artisan migrate:status

      - name: Run Laravel Dusk Tests
        run: docker exec --no-tty smarthire_laravel php artisan dusk
        continue-on-error: false

      - name: Docker Compose Logs on Failure
        if: failure()

        run: docker compose logs





