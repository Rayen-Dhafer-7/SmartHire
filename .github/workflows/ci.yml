name: SmartHire CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2️⃣ Prepare env files
      - name: Prepare env and dirs for CI
        run: |
          cp laravel/.env.example laravel/.env
          echo "VITE_API_URL=http://placeholder:8000" > vue/.env
          echo "FRONTEND_URL=http://placeholder:5174" >> vue/.env
          mkdir -p certs

      # 3️⃣ Copy your local certs from repo to container
      - name: Copy SSL certs to Laravel container
        run: |
          LARAVEL_CONTAINER=$(docker compose ps -q laravel)
          echo "Laravel container: $LARAVEL_CONTAINER"
          docker cp certs/ca.pem $LARAVEL_CONTAINER:/var/www/html/certs/ca.pem

      # 4️⃣ Install Vue dependencies
      - name: Install Vue node_modules
        run: |
          cd vue
          npm install --include=dev
          npm install vite@latest --save-dev

      # 5️⃣ Start Docker services
      - name: Start services
        run: docker compose up -d --build --wait

      # 6️⃣ Fix Laravel permissions
      - name: Fix Laravel permissions
        run: |
          docker exec smarthire_laravel chmod -R 775 storage bootstrap/cache
          docker exec smarthire_laravel chown -R www-data:www-data storage bootstrap/cache

      # 7️⃣ Show container status
      - name: Show containers
        run: docker compose ps -a

      # 8️⃣ Set host IP for Vue + Behat
      - name: Set Vue .env and Behat base_url
        run: |
          HOST_IP=$(docker exec smarthire_selenium ip route show default | awk '/default/ {print $3}')
          if [ -z "$HOST_IP" ]; then HOST_IP="172.17.0.1"; fi

          echo "VITE_API_URL=http://${HOST_IP}:8000" > vue/.env
          echo "FRONTEND_URL=http://${HOST_IP}:5174" >> vue/.env
          sed -i "s|base_url:.*|base_url: http://${HOST_IP}:5174|" laravel/behat.yml

      - name: Restart Vue
        run: docker compose restart vue

      # 9️⃣ Prepare Laravel key only (no migrations)
      - name: Generate Laravel key
        run: docker exec smarthire_laravel php artisan key:generate --force

      # 🔟 Wait for Laravel to respond
      - name: Wait for Laravel
        run: |
          echo "Waiting for Laravel..."
          code="000"
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || true)
            if [ "$code" != "000" ]; then echo "Laravel responded HTTP $code"; break; fi
            sleep 5
          done
          if [ "$code" = "000" ]; then docker compose logs laravel --tail=80; exit 1; fi

      # 1️⃣1️⃣ Wait for Vue dev server
      - name: Wait for Vue
        run: |
          echo "Polling Vue..."
          code="000"
          for i in $(seq 1 72); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5174/ || true)
            if [ "$code" != "000" ]; then echo "Vue responded HTTP $code"; break; fi
            sleep 5
          done
          if [ "$code" = "000" ]; then docker compose logs vue --tail=200; exit 1; fi

      # 1️⃣2️⃣ Test Aiven connection + latency
      - name: Test Aiven MySQL connection
        run: |
          echo "Testing Aiven connection..."
          curl http://localhost:8000/debug-speed

      # 1️⃣3️⃣ Warm SPA
      - name: Warm Vue app
        run: |
          curl -s -o /dev/null http://localhost:5174/
          curl -s -o /dev/null http://localhost:5174/login
          sleep 15

      # 1️⃣4️⃣ Run Behat tests
      - name: Run Behat tests
        run: docker exec smarthire_laravel vendor/bin/behat --format=pretty
