name: SmartHire CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Laravel .env file
        run: |
          cat <<EOF > laravel/.env
          APP_NAME=SmartHire
          APP_ENV=testing
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_API_URL=${{ secrets.GROQ_API_URL }}
          GROQ_MODEL=${{ secrets.GROQ_MODEL }}
          FRONTEND_URL=http://172.21.0.1:5174
          EOF

      - name: Create Vue .env file
        run: |
          cat <<EOF > vue/.env
          VITE_API_URL=http://host.docker.internal:8000
          FRONTEND_URL=http://host.docker.internal:5174
          EOF

      - name: Install Vue node_modules for CI
        run: |
          cd vue
          npm install --include=dev
          npm install vite@latest --save-dev
          ls node_modules/.bin/vite

      - name: Build and run Docker containers
        run: docker compose up -d --build

      - name: Wait for Selenium to be ready
        run: |
          timeout 120s bash -c 'until curl -sf http://localhost:4444/wd/hub/status | grep -q "ready.*true"; do echo "waiting for selenium..."; sleep 3; done'

      - name: Wait for Laravel to be ready
        run: |
          timeout 120s bash -c 'until curl -sf http://localhost:8000; do echo "waiting for laravel..."; sleep 3; done'

      - name: Wait for Vue to be ready
        run: |
          timeout 120s bash -c 'until curl -sf http://localhost:5174; do echo "waiting for vue..."; sleep 3; done'

      - name: Show container status
        run: |
          docker compose ps
          docker logs smarthire_laravel
          docker logs smarthire_selenium

      - name: Run Behat Selenium Tests
        run: docker exec smarthire_laravel vendor/bin/behat --format=pretty --no-interaction

      - name: Docker Compose Logs on Failure
        if: failure()
        run: docker compose logs