name: SmartHire CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Laravel .env file
        run: |
          cat <<EOF > laravel/.env
          APP_NAME=SmartHire
          APP_ENV=testing
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_API_URL=${{ secrets.GROQ_API_URL }}
          GROQ_MODEL=${{ secrets.GROQ_MODEL }}
          DUSK_DRIVER_URL=http://selenium:4444/wd/hub
          FRONTEND_URL=http://smarthire_vue:5174
          EOF

      - name: Build and run Docker containers
        run: docker compose up -d --build
        
      - name: Install Vue dependencies
        run: docker exec smarthire_vue npm install --include=dev

      - name: Wait for Laravel to be ready
        run: |
          timeout 120s bash -c 'until curl -sf http://localhost:8000; do echo "waiting..."; sleep 3; done'

      - name: Wait for Selenium to be ready
        run: |
          timeout 60s bash -c 'until curl -sf http://localhost:4444/status; do echo "waiting for selenium..."; sleep 3; done'

      - name: Wait for Vue to be ready
        run: |
          timeout 60s bash -c 'until curl -sf http://localhost:5174; do echo "waiting for vue..."; sleep 3; done'

      - name: Run Migrations
        run: docker exec smarthire_laravel php artisan migrate --force

      - name: Run Behat Selenium Tests
        run: docker exec smarthire_laravel vendor/bin/behat --format=pretty --no-interaction

      - name: Docker Compose Logs on Failure
        if: failure()
        run: docker compose logs