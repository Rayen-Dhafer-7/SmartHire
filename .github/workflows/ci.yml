name: SmartHire CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Laravel .env for CI
        run: cp laravel/.env.example laravel/.env

      - name: Start services with Docker Compose
        run: docker compose up -d --build --wait

      - name: Show container status
        run: docker compose ps -a

      - name: Prepare Laravel (key, migrate)
        run: |
          docker exec smarthire_laravel php artisan key:generate --force
          docker exec smarthire_laravel php artisan migrate --force

      - name: Wait for Laravel to respond
        run: |
          echo "Waiting for Laravel..."
          code="000"
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || true)
            if [ "$code" != "000" ]; then
              echo "Laravel responded HTTP $code"
              break
            fi
            echo "Waiting... ($i/24)"
            sleep 5
          done
          if [ "$code" = "000" ]; then
            echo "Laravel did not respond. Container logs:"
            docker compose logs laravel --tail=50
            exit 1
          fi

      - name: Wait for Vue dev server to respond
        run: |
          echo "Waiting for Vue..."
          code="000"
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5174/ || true)
            if [ "$code" != "000" ]; then
              echo "Vue responded HTTP $code"
              break
            fi
            echo "Waiting for Vue... ($i/36)"
            sleep 5
          done
          if [ "$code" = "000" ]; then
            echo "Vue did not respond. Container logs:"
            docker compose logs vue --tail=50
            exit 1
          fi

      - name: Run Behat tests
        run: docker exec smarthire_laravel vendor/bin/behat --format=pretty
