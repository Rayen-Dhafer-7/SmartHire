default:
  suites:
    default:
      contexts:
        - FeatureContext

  extensions:
    Behat\MinkExtension:
      # Use Docker service name so the browser (Chrome in Selenium) can reach the Vue app from any environment
      base_url: http://vue:5174
      browser_name: chrome
      sessions:
        default:
          selenium2:
            wd_host: http://smarthire_selenium:4444/wd/hub
            capabilities:
              browserName: chrome
              extra_capabilities:
                chromeOptions:
                  args:
                    - "--headless"
                    - "--no-sandbox"
                    - "--disable-dev-shm-usage"
                    - "--disable-gpu"
                    - "--window-size=1920,1080"