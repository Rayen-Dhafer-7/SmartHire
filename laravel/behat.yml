default:
  suites:
    default:
      contexts:
        - FeatureContext

  extensions:
    Behat\MinkExtension:
      base_url: http://laravel:80      
      sessions:
        default:
          selenium2:
            wd_host: http://smarthire_selenium:4444/wd/hub
            browser: chrome
            capabilities:
              browserName: chrome
              version: "*"
              platform: LINUX
              extra_capabilities:
                chromeOptions:
                  args:
                    - --disable-gpu
                    - --no-sandbox
                    - --headless
                    - --window-size=1920,1080